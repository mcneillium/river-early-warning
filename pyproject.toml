[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rew"
version = "0.1.0"
description = "River early warning across 671 British catchments (CAMELS-GB v2)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas>=3.0",
    "pyarrow",
    "pyyaml",
    "lightgbm>=4",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]
analysis = ["matplotlib", "scipy"]
foundation = ["chronos-forecasting>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded CAMELS-GB v2 files in data/"]
